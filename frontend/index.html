<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VacineJá: acompanhamento da vacinação dos moradores da UBS Jardim Novo Horizonte">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Public+Sans:wght@400;600;700&display=swap">
    <title>VacineJá</title>
    <script>
      (function () {
        var escuro = window.matchMedia('(prefers-color-scheme: dark)');
        function aplicar() {
          document.documentElement.setAttribute('data-bs-theme', escuro.matches ? 'dark' : 'light');
        }
        aplicar();
        escuro.addEventListener('change', aplicar);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
